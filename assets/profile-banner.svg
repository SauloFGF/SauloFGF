<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Saulo Figueiredo — Full Stack Software Engineer</title>
  <desc id="description">Banner de perfil com foco em backend .NET, APIs, microsserviços e inteligência artificial.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b1d" />
      <stop offset="0.55" stop-color="#151342" />
      <stop offset="1" stop-color="#0b2b4d" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="0.5" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#background)" />
  <rect width="1200" height="300" rx="28" fill="url(#grid)" />
  <circle cx="1010" cy="54" r="210" fill="url(#glow-cyan)" />
  <circle cx="180" cy="300" r="190" fill="url(#glow-purple)" />
  <path d="M 850 -30 C 960 40, 1010 110, 1240 80" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="2" />
  <path d="M 760 330 C 900 220, 1000 250, 1240 150" fill="none" stroke="#8b5cf6" stroke-opacity="0.28" stroke-width="2" />

  <g opacity="0.42" fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M 101 54 h 34 M 101 72 h 20" stroke="#22d3ee" />
    <path d="M 1095 50 v 30 M 1080 65 h 30" stroke="#34d399" />
  </g>

  <rect x="72" y="54" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.16" />
  <circle cx="91" cy="71" r="5" fill="#34d399" />
  <text x="106" y="77" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">SAULOFGF</text>

  <text x="72" y="145" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">SAULO FIGUEIREDO</text>
  <text x="75" y="184" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3.4">FULL STACK SOFTWARE ENGINEER</text>
  <rect x="75" y="208" width="410" height="3" rx="1.5" fill="url(#accent)" />
  <text x="75" y="244" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Backend .NET  •  APIs  •  Microsserviços  •  IA</text>

  <g transform="translate(1010 150)" opacity="0.88">
    <circle cx="0" cy="0" r="57" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />
    <path d="M -22 22 L -22 -22 L 22 22 L 22 -22" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-29" cy="31" r="4" fill="#34d399" />
    <circle cx="29" cy="-31" r="4" fill="#a78bfa" />
  </g>

  <text x="1128" y="264" text-anchor="end" fill="#94a3b8" fill-opacity="0.78" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.6">BUILD • LEARN • EVOLVE</text>
</svg>
